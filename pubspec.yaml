name: lexiflow
description: "LexiFlow - Modern Oxford & TFLAT Spaced Repetition Dictionary App."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  google_sign_in: ^6.2.1
  provider: ^6.1.2
  flip_card: ^0.7.0
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  google_mlkit_text_recognition: ^0.16.0
  camera: ^0.12.0+2
  google_fonts: ^8.2.0
  audioplayers: ^5.2.1
  http: ^1.1.0
  image_picker: ^1.0.4
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.1
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
